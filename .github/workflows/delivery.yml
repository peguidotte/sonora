name: Aplicações — CI e deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.inventory.outputs.api }}
      soa: ${{ steps.inventory.outputs.soa }}
      mobile: ${{ steps.inventory.outputs.mobile }}
      backends: ${{ steps.inventory.outputs.backends }}
      has_backends: ${{ steps.inventory.outputs.has_backends }}
      dotnet_sdk: ${{ steps.inventory.outputs.dotnet_sdk }}
      java_version: ${{ steps.inventory.outputs.java_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar contratos e ferramentas antes dos builds
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/validate_contracts.py
          python -m unittest discover -s tools -p 'test_*.py' -v
      - id: inventory
        run: python deploy/pipeline.py inventory
      - name: Registrar componentes ainda sem implementação
        run: |
          echo 'Componentes sem projeto real são declarados ausentes e não são publicados como mocks.' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_RUNTIME_IDENTIFIER: ${{ vars.DOTNET_RUNTIME_IDENTIFIER || 'linux-arm64' }}
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sonora
      PGUSER: sonora_migrator
      PGPASSWORD: ci-migration-only
      SONORA_DB_HOST: 127.0.0.1
      SONORA_DB_PORT: '5432'
      SONORA_DB_NAME: sonora
      DO_API: ${{ needs.inventory.outputs.api }}
      DO_SOA: ${{ needs.inventory.outputs.soa }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sonora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sonora"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: needs.inventory.outputs.api == 'true'
        with:
          dotnet-version: ${{ needs.inventory.outputs.dotnet_sdk }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.inventory.outputs.java_version }}
      - name: Preparar contas isoladas no banco descartável de CI
        env:
          PGPASSWORD: ci-admin-only
        run: |
          psql -h 127.0.0.1 -U postgres -d sonora -v ON_ERROR_STOP=1 -f database/ci-roles.sql
      - name: Preparar Flyway e testar migrations sem aplicações
        env:
          SONORA_DATABASE_TESTS: '1'
        run: |
          python database/prepare.py
          python -m unittest discover -s tools -p 'test_database*.py' -v
      - name: Testar e empacotar aplicações presentes
        run: |
          set -euo pipefail
          if [[ "$DO_SOA" == 'true' ]]; then
            SONORA_DB_USER=sonora_ingest SONORA_DB_PASSWORD=ci-ingest-only python deploy/pipeline.py package soa
          fi
          if [[ "$DO_API" == 'true' ]]; then
            SONORA_DB_USER=sonora_query SONORA_DB_PASSWORD=ci-query-only python deploy/pipeline.py package api
          fi
      - name: Conferir contratos contra PostgreSQL real e versão anterior
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$DO_API" != 'true' && "$DO_SOA" != 'true' ]]; then options+=(--allow-unimplemented); fi
          if [[ -n "$BASELINE_REF" && ! "$BASELINE_REF" =~ ^0+$ ]]; then options+=(--baseline-ref "$BASELINE_REF"); fi
          python tools/check_database_compatibility.py "${options[@]}"
          python deploy/pipeline.py package database
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: release-components
          path: |
            output/releases/*.tar.gz
            output/releases/*.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [inventory, build]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.inventory.result == 'success' &&
      needs.build.result == 'success' &&
      vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: sonora-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
      AZURE_RELEASE_STORAGE: ${{ vars.AZURE_RELEASE_STORAGE }}
      DO_SOA: ${{ needs.inventory.outputs.soa }}
      DO_API: ${{ needs.inventory.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-components
          path: output/releases
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verificar identidade e acesso ao destino antes do deploy
        run: |
          az vm show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME" --query provisioningState --output tsv
          az storage container show --account-name "$AZURE_RELEASE_STORAGE" --name releases --auth-mode login --query name --output tsv
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'deploy')
          from pipeline import require_student_limit
          require_student_limit(os.environ['AZURE_SUBSCRIPTION_ID'])
          PY
      - name: Migrar banco e publicar serviços independentes
        run: |
          set -euo pipefail
          python deploy/pipeline.py publish database
          if [[ "$DO_SOA" == 'true' ]]; then python deploy/pipeline.py publish soa; fi
          if [[ "$DO_API" == 'true' ]]; then python deploy/pipeline.py publish api; fi

  mobile:
    needs: inventory
    if: needs.inventory.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar e validar TypeScript
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
      - name: Gerar Android com Expo e compilar APK de demonstração
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: sonora-android-demo
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
      - name: Explicar distribuição
        run: echo 'APK de demonstração nos artefatos desta execução; não publica em loja nem contém chave de API.' >> "$GITHUB_STEP_SUMMARY"
