name: Smoke integrado — manual

on:
  workflow_dispatch:
    inputs:
      from:
        description: Início UTC do período consultado
        required: true
        default: '2026-11-08T15:00:00Z'
      to:
        description: Fim UTC do período consultado
        required: true
        default: '2026-11-08T16:00:00Z'

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Consultar serviços reais configurados
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOA_BASE_URL: ${{ vars.SOA_BASE_URL }}
          SOA_OPERATOR_KEY: ${{ secrets.SOA_OPERATOR_KEY }}
          PERIOD_FROM: ${{ inputs.from }}
          PERIOD_TO: ${{ inputs.to }}
        run: python tools/smoke_integration.py --from "$PERIOD_FROM" --to "$PERIOD_TO"
