name: Smoke integrado — manual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verificação na VM Azure ou validação OpenAPI externa com chaves configuradas
        type: choice
        options: [azure, external]
        default: azure
      from:
        description: Início UTC (modo external)
        required: true
        default: '2026-11-08T15:00:00Z'
      to:
        description: Fim UTC (modo external)
        required: true
        default: '2026-11-08T16:00:00Z'

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Consultar serviços reais configurados
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOA_BASE_URL: ${{ vars.SOA_BASE_URL }}
          API_READ_KEY: ${{ secrets.API_READ_KEY }}
          API_OPERATOR_KEY: ${{ secrets.API_OPERATOR_KEY }}
          SOA_OPERATOR_KEY: ${{ secrets.SOA_OPERATOR_KEY }}
          PERIOD_FROM: ${{ inputs.from }}
          PERIOD_TO: ${{ inputs.to }}
        run: python tools/smoke_integration.py --from "$PERIOD_FROM" --to "$PERIOD_TO"

  azure:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'azure'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validar serviços e consultar perfil simulado com credenciais locais da VM
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM: ${{ vars.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/smoke.sh"
          {
            echo 'set -eu'
            echo 'bash /opt/sonora/bootstrap/verify.sh'
            printf 'echo %s | base64 -d | bash -s -- --check\n' "$(base64 -w0 linux/demo.sh)"
            echo 'echo SONORA_AZURE_SMOKE_OK'
          } > "$script"
          result=$(az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM" --command-id RunShellScript --scripts "@$script" --query 'value[].message' -o tsv)
          printf '%s\n' "$result"
          grep -Fxq SONORA_AZURE_SMOKE_OK <<< "$result"
