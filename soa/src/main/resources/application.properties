spring.application.name=sonora-ingestion
server.address=${SONORA_HTTP_HOST:127.0.0.1}
server.port=${SONORA_HTTP_PORT:8082}
spring.datasource.url=jdbc:postgresql://${SONORA_DB_HOST:127.0.0.1}:${SONORA_DB_PORT:55432}/${SONORA_DB_NAME:sonora}?connectTimeout=3
spring.datasource.username=${SONORA_DB_USER:sonora_ingest}
spring.datasource.password=${SONORA_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=sonora
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=false
springdoc.api-docs.path=/api/ingestion/v1/openapi.json
springdoc.api-docs.version=OPENAPI_3_1
server.error.include-message=never
server.error.include-stacktrace=never
