services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sonora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-admin-only
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ./ci-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sonora"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: eclipse-temurin:21-jre
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace/database
    volumes: ["..:/workspace:ro"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: sonora
      PGUSER: sonora_migrator
      PGPASSWORD: ci-migration-only
      FLYWAY_HOME: /workspace/output/tools/flyway
    entrypoint: ["bash", "migrate.sh"]
